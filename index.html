<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Gallery</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 1.6rem;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  #search {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.9rem;
  }
  .count {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  #status {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #10131a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .info {
    padding: 10px 12px 12px;
  }
  .name {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .cost {
    color: var(--accent);
    font-weight: 700;
    font-size: 0.95rem;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 0;
  }
  .error {
    color: #ff6b6b;
    background: #2a1518;
    border: 1px solid #4a2226;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Cosmetic Gallery</h1>
<div class="sub" id="repoLabel">Loading from GitHub…</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search Cosmetics…" autocomplete="off" />
  <select id="sort">
    <option value="name-asc">Name (A–Z)</option>
    <option value="name-desc">Name (Z–A)</option>
    <option value="cost-asc">Cost (low–high)</option>
    <option value="cost-desc">Cost (high–low)</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="status">Loading Cosmetics…</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No Cosmetics match your search.</div>

<script>
/* ====================== CONFIG ======================
   Edit these to point at your repo/folder of PNGs.
   branch: the branch to read from (usually "main")
   path:   folder inside the repo containing the images
   ====================================================== */
const CONFIG = {
  owner: "Leonkatze1",
  repo: "Yeeps",
  branch: "main",
  path: "cosmetics", // folder containing "{ITEM_NAME}-{COST}.png" files
};

const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?ref=${CONFIG.branch}`;

const els = {
  status: document.getElementById("status"),
  grid: document.getElementById("grid"),
  empty: document.getElementById("empty"),
  search: document.getElementById("search"),
  sort: document.getElementById("sort"),
  count: document.getElementById("count"),
  repoLabel: document.getElementById("repoLabel"),
};

let items = [];

function parseFilename(filename) {
  // Strip extension
  const base = filename.replace(/\.png$/i, "");
  // Split on the LAST "-" so item names can contain dashes too
  const idx = base.lastIndexOf("-");
  if (idx === -1) {
    return { name: base.replace(/_/g, " "), cost: null };
  }
  const namePart = base.slice(0, idx);
  const costPart = base.slice(idx + 1);
  const costNum = parseFloat(costPart.replace(/[^0-9.]/g, ""));
  return {
    name: namePart.replace(/_/g, " "),
    cost: isNaN(costNum) ? null : costNum,
    rawCost: costPart,
  };
}

async function loadItems() {
  els.repoLabel.textContent = `${CONFIG.owner}/${CONFIG.repo} — /${CONFIG.path}`;
  try {
    const res = await fetch(apiUrl, {
      headers: { Accept: "application/vnd.github.v3+json" },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`GitHub API returned ${res.status} ${res.statusText}\n${body.slice(0, 300)}`);
    }
    const data = await res.json();
    if (!Array.isArray(data)) {
      throw new Error("Configured path is not a directory, or repo/path is wrong.");
    }

    items = data
      .filter((f) => f.type === "file" && /\.png$/i.test(f.name))
      .map((f) => {
        const parsed = parseFilename(f.name);
        return {
          filename: f.name,
          url: f.download_url,
          name: parsed.name,
          cost: parsed.cost,
        };
      });

    els.status.style.display = "none";
    render();
  } catch (err) {
    els.status.innerHTML = `<div class="error">Failed to load cosmetics from GitHub.\n\n${err.message}\n\nCheck the CONFIG block at the top of the script (owner / repo / branch / path).</div>`;
  }
}

function render() {
  const query = els.search.value.trim().toLowerCase();
  const sortMode = els.sort.value;

  let filtered = items.filter((it) => it.name.toLowerCase().includes(query));

  filtered.sort((a, b) => {
    switch (sortMode) {
      case "name-asc":
        return a.name.localeCompare(b.name);
      case "name-desc":
        return b.name.localeCompare(a.name);
      case "cost-asc":
        return (a.cost ?? Infinity) - (b.cost ?? Infinity);
      case "cost-desc":
        return (b.cost ?? -Infinity) - (a.cost ?? -Infinity);
      default:
        return 0;
    }
  });

  els.count.textContent = `${filtered.length} / ${items.length} item${items.length === 1 ? "" : "s"}`;
  els.grid.innerHTML = "";
  els.empty.style.display = filtered.length === 0 ? "block" : "none";

  const frag = document.createDocumentFragment();
  for (const it of filtered) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb"><img src="${it.url}" alt="${escapeHtml(it.name)}" loading="lazy"></div>
      <div class="info">
        <div class="name">${escapeHtml(capitalize(it.name))}</div>
        <div class="cost">${it.cost !== null ? "$" + it.cost : "—"}</div>
      </div>
    `;
    frag.appendChild(card);
  }
  els.grid.appendChild(frag);
}

function capitalize(s) {
  return s.replace(/\b\w/g, (c) => c.toUpperCase());
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

els.search.addEventListener("input", render);
els.sort.addEventListener("change", render);

loadItems();
</script>

</body>
</html>
