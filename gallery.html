<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back-link" href="index.html">&larr; Back to menu</a>
<h1 id="pageTitle">Gallery</h1>
<div class="sub" id="pageSub">Loading…</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search…" autocomplete="off" />
  <select id="sort">
    <option value="name-asc">Name (A–Z)</option>
    <option value="name-desc">Name (Z–A)</option>
    <option value="cost-asc">Cost (low–high)</option>
    <option value="cost-desc">Cost (high–low)</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="status">Loading items…</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No items match your search.</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const category = params.get("category") || "items";
  initGallery(category);
</script>

</body>
</html>
