<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back-link" href="index.html">&larr; Back to menu</a>
<h1 id="pageTitle">Gallery</h1>
<div class="sub" id="pageSub">Loading…</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search…" autocomplete="off" />
  <select id="sort">
    <option value="name-asc">Name (A–Z)</option>
    <option value="name-desc">Name (Z–A)</option>
    <option value="cost-asc">Cost (low–high)</option>
    <option value="cost-desc">Cost (high–low)</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="status">Loading items…</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No items match your search.</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-body">
      <div class="modal-thumb"><img id="modalImg" src="" alt=""></div>
      <div class="modal-info">
        <h2 id="modalName"></h2>
        <div class="modal-costs" id="modalCosts"></div>
        <p class="modal-desc" id="modalDesc"></p>
        <h3 class="modal-sounds-heading">Sounds</h3>
        <table class="sounds-table" id="modalSoundsTable">
          <tbody id="modalSoundsBody"></tbody>
        </table>
        <div class="empty" id="modalSoundsEmpty" style="display:none;">No matching sounds found.</div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const category = params.get("category") || "items";
  initGallery(category);
</script>

</body>
</html>
